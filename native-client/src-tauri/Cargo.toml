[package]
name = "md-collab-native-client"
version = "0.1.0"
edition = "2021"
description = "md-collab native desktop client (Tauri 2, read-only PR1)"
license = "MIT"
publish = false

[lib]
name = "md_collab_native_client_lib"
path = "src/lib.rs"

[[bin]]
name = "md-collab-native-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync"] }
walkdir = "2"
globset = "0.4"
sha2 = "0.10"
notify = "6"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[features]
# this feature is used for production builds or when a dev-server is not specified
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
