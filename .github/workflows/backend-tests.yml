name: Backend Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'spec/backend/**'
      - 'guidance/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'spec/backend/**'
      - 'guidance/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-tests.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Coverage threshold check
        run: npm run test:coverage

      - name: Full acceptance suite
        run: npm run accept

      - name: Traceability check
        run: npm run traceability:check
