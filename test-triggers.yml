# Shared by CI (dorny/paths-filter) and pre-push hook
# Tests run if ANY changed file matches these patterns

code:
  - 'src/**'
  - 'vscode-extension/src/**'
  - 'obsidian-plugin/src/**'
  - 'native-client/src/**'
  - 'native-client/src-tauri/src/**'
  - 'native-client/src-tauri/Cargo.toml'
  - 'native-client/src-tauri/Cargo.lock'
  - 'native-client/src-tauri/tauri.conf.json'
  - 'native-client/src-tauri/capabilities/**'
  - 'native-client/src-tauri/build.rs'
  - 'native-client/scripts/**'
  - 'native-client/package.json'
  - 'native-client/package-lock.json'
  - 'native-client/tsconfig.json'
  - 'native-client/vite.config.ts'
  - 'tests/**'
  - 'schemas/**'
  - 'vitest.config.ts'
  - 'tsconfig.json'
  - 'package.json'
